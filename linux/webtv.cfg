# WebTV modem settings (webtv_modem.py). Restart after a change: webtv_modem.sh restart
#
# local: answer the box's calls with the built-in WebTV service (nothing else needed on the network)
# HOST:PORT: relay calls to a line server instead (webtv_modem.py --listen PORT, or lineserver.mjs)
connect=local
# 1: copy the core's debug console into the log (/tmp/webtv_modem.log)
log=1
# fetch web pages for the box (0: only the service's own pages)
#web=1
# convert images the box can't show (PNG, progressive JPEG...) and shrink ones wider than the screen
#images=1
#image_quality=60
# largest page sent to the box, after scripts and styles are stripped (the box has 8 MB of RAM)
#max_page=393216
# check HTTPS certificates (against Mozilla's roots built into webtv_modem.py, plus the system's)
#tls_verify=1
#cafile=/path/to/extra-roots.pem
# where registrations are kept (default: webtv-accounts.json next to webtv_modem.py)
#store=/media/fat/linux/webtv/webtv-accounts.json
# 1: log PPP, TCP and service details
#verbose=0
